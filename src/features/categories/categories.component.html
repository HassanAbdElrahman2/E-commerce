  <section
  class="min-h-[240px] bg-gradient-to-r from-green-600 to-green-400 px-5 md:px-20 py-10 text-white"
>
  <!-- Breadcrumb -->
  <div class="flex items-center gap-4 text-base mb-8">
    <span>Home</span>

    <span class="text-white/60">/</span>

    <span class="font-semibold">Categories</span>
  </div>

  <!-- Title -->
  <div class="flex items-center gap-6">
    
    <!-- Icon -->
    <div
      class="flex h-20 w-20 shrink-0 items-center justify-center rounded-[20px]
             bg-white/20 shadow-lg backdrop-blur-sm"
    >
      <i class="fa-solid fa-layer-group text-4xl"></i>
    </div>

    <!-- Text -->
    <div>
      <h1 class="text-3xl md:text-4xl font-bold">
       All Categories
      </h1>

      <p class="mt-2 text-lg md:text-xl">
        Browse our wide range of product categories
      </p>
    </div>

  </div>
</section>
<section class="p-10">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-6">

  @for (category of categoryList(); track category._id) {

    <div
      class="group cursor-pointer rounded-2xl border border-gray-200 bg-white
             p-6 shadow-sm transition-all duration-300
             hover:border-primary hover:shadow-lg"
    >

      <!-- Image -->
      <div class="overflow-hidden rounded-2xl">
        <img
          [src]="category.image"
          [alt]="category.name"
          class="h-[180px] w-full object-cover
                 transition-transform duration-500
                 group-hover:scale-105"
        />
      </div>

      <!-- Category Name -->
      <h3
        class="mt-5 text-center text-lg font-bold text-gray-900
               transition-colors duration-300
               group-hover:text-primary"
      >
        {{ category.name }}
      </h3>

      <!-- Subcategories Link -->
      <div
        class="mt-3 text-center
               opacity-0 translate-y-2
               transition-all duration-300
               group-hover:opacity-100
               group-hover:translate-y-0"
      >
        <a
          [routerLink]="['/categories', category._id]"
          class="text-primary text-sm font-medium"
        >
          View Subcategories →
        </a>
      </div>

    </div>

  }

</div>
</section>
