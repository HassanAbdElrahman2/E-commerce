  <section
  class="min-h-[240px] bg-gradient-to-r from-green-600 to-green-400 px-5 md:px-20 py-10 text-white"
>
  <!-- Breadcrumb -->
  <div class="flex items-center gap-4 text-base mb-8">
    <span>Home</span>

    <span class="text-white/60">/</span>

    <span class="font-semibold">Categories</span>
  </div>

  <!-- Title -->
  <div class="flex items-center gap-6">
    
    <!-- Icon -->
    <div
      class="flex h-20 w-20 shrink-0 items-center justify-center rounded-[20px]
             bg-white/20 shadow-lg backdrop-blur-sm"
    >
      <i class="fa-solid fa-layer-group text-4xl"></i>
    </div>

    <!-- Text -->
    <div>
      <h1 class="text-3xl md:text-4xl font-bold">
       All Categories
      </h1>

      <p class="mt-2 text-lg md:text-xl">
        Browse our wide range of product categories
      </p>
    </div>

  </div>
</section>
<section class="p-10">
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

  @for (subcategory of subCategoryList(); track subcategory._id) {

    <div
      class="group cursor-pointer rounded-2xl border border-gray-200 bg-white p-5
             transition-all duration-300 ease-out
             hover:-translate-y-1 hover:scale-[1.02]
             hover:border-emerald-300 hover:shadow-xl"
    >

      <!-- Icon -->
      <div
        class="mb-7 flex h-18 w-18 items-center justify-center rounded-2xl
               bg-gray-50
               transition-all duration-300
               group-hover:bg-emerald-100"
      >
        <i
          class="fa-solid fa-folder text-3xl text-emerald-600
                 transition-transform duration-300
                 group-hover:scale-110"
        ></i>
      </div>

      <!-- Title -->
      <h3
        class="text-xl font-bold text-gray-900
               transition-colors duration-300
               group-hover:text-emerald-600"
      >
        {{ subcategory.name }}
      </h3>

      <!-- Button -->
      <a
        [routerLink]="['/shop']"
        [queryParams]="{ subcategory: subcategory._id }"
        class="mt-3 flex items-center gap-2
               text-base font-medium text-emerald-600
               opacity-0 translate-y-2
               transition-all duration-300
               group-hover:opacity-100
               group-hover:translate-y-0"
      >
        Browse Products

        <i 
          class="fa-solid fa-arrow-right
                 transition-transform duration-300
                 group-hover:translate-x-1"
        ></i>
      </a>

    </div>

  }

</div>
</section>
